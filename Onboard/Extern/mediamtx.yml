# MediaMTX configuration template for LteCar
#
# The Onboard service rewrites the section after the marker line
# below at runtime based on the active streams in
# Onboard/channelMap.json. Keep the marker line (and the trailing
# all_others block as the anchor) so MediaMtxConfigurator can locate
# the section. Do NOT add comments that contain the marker as a
# substring; the matcher is a naive IndexOf and would otherwise
# mis-position the split point.

paths:
  frontCamera:
    source: rpiCamera
    runOnInit: ffmpeg -t 2147483647 -i rtsp://localhost:8554/frontCamera -c copy -f rtp rtp://lte-rc.northeurope.cloudapp.azure.com:10000?pkt_size=1300
    runOnInitRestart: yes
    rpiCameraCamID: 0
    rpiCameraWidth: 1024
    rpiCameraHeight: 768
    rpiCameraFPS: 22
    rpiCameraTextOverlay: '%Y-%m-%d %H:%M:%S - frontCamera'
    rpiCameraBrightness: 0.3
    rpiCameraBitrate: 1000000
    rpiCameraIDRPeriod: 60
  all_others:
