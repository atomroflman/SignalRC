<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 10">
  <style><![CDATA[
    /* type < class < id; later wins on equal specificity */
    rect { fill: red; stroke: black; }
    .a { fill: green; }
    .b { fill: blue; }
    #c { fill: yellow !important; }
    g > rect, rect + rect, rect[width], :root rect, *.a { stroke: purple; }
    .a { stroke-width: 2px; }
  ]]></style>
  <rect class="a" width="10" height="10" fill="orange"/>
  <rect class="a b" x="10" width="10" height="10"/>
  <rect id="c" class="a" x="20" width="10" height="10" style="fill: #0ff"/>
  <rect x="30" width="10" height="10" style="fill:currentColor; color: rgba(255,0,0,0.5)"/>
</svg>
